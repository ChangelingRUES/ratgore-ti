- type: entity
  parent: BaseComputerAiAccess
  id: CrewMonitor
  name: improved crew monitoring console
  description: Shows all crew members across the entire map. No server required.
  suffix: Rat, DEBUG
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: crew
    - map: ["computerLayerKeys"]
      state: med_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#006400"
  - type: Computer
    board: CrewMonitoringComputerCircuitboard
  - type: ActivatableUI
    key: enum.RatCrewMonitorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.RatCrewMonitorUiKey.Key:
        type: Content.Client._Rat.CrewMonitoring.RatCrewMonitorBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: RatCrewMonitor
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
  - type: WirelessNetworkConnection
    range: 1200

